version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "REACT_APP_BASE_URL=https://api.starflickswiki.com/api" >> .env
        - echo "REACT_APP_BASE_URL_AUTH=https://api.starflickswiki.com/api/auth" >> .env

    build:
      commands:
        - npm install
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
      - public/sitemap.xml
      - public/robots.txt
  cache:
    paths:
      - node_modules/**/*
